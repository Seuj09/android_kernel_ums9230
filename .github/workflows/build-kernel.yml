name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches: [ bpf-eun-baseline ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc cpio libssl-dev xz-utils dwarves \
            clang lld llvm gcc-aarch64-linux-gnu

      - name: Fetch proton-12 toolchain (Seuj build clang)
        run: |
          # eun bpf tip has no toolchain submodule; Seuj builds rely on
          # proton-12 at ./toolchain (Makefile auto-detect on Seuj trees).
          # For eun Makefile, put clang on PATH explicitly.
          git clone --depth=1 https://github.com/maxsteeel/proton-12 toolchain
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/toolchain/bin/clang" --version | head -2
          ls "$GITHUB_WORKSPACE/toolchain/bin/ld.lld"

      - name: Build Image
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          # eun bpf baseline: transsion9230_defconfig with CMDLINE=""
          make LLVM=1 LLVM_IAS=1 O="out" transsion9230_defconfig
          make LLVM=1 LLVM_IAS=1 O="out" -j$(nproc) Image

      - name: Compress Image with xz -9e
        run: |
          xz -9e -k -c out/arch/arm64/boot/Image > out/arch/arm64/boot/Image.xz

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image-${{ github.sha }}
          path: out/arch/arm64/boot/Image.xz
          if-no-files-found: error
