name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches: [ bpf-eun-baseline ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc cpio libssl-dev xz-utils dwarves

      - name: Fetch proton-12 toolchain (Seuj clang)
        run: |
          # Do NOT put toolchain/bin on PATH — proton ld is too old for
          # Ubuntu 24.04 host libc (.relr.dyn). Host tools use system gcc;
          # target build uses explicit proton clang paths (Seuj style).
          git clone --depth=1 https://github.com/maxsteeel/proton-12 toolchain
          test -x toolchain/bin/clang
          test -x toolchain/bin/ld.lld

      - name: Build Image
        run: |
          TC="$GITHUB_WORKSPACE/toolchain/bin"
          export ARCH=arm64
          # eun bpf baseline: transsion9230_defconfig with CMDLINE=""
          make O="out" \
            HOSTCC=gcc HOSTCXX=g++ \
            CC="$TC/clang" LD="$TC/ld.lld" AR="$TC/llvm-ar" NM="$TC/llvm-nm" \
            OBJCOPY="$TC/llvm-objcopy" OBJDUMP="$TC/llvm-objdump" \
            READELF="$TC/llvm-readelf" STRIP="$TC/llvm-strip" \
            CROSS_COMPILE="$TC/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$TC/arm-linux-gnueabi-" \
            LLVM=1 LLVM_IAS=1 \
            transsion9230_defconfig
          make O="out" \
            HOSTCC=gcc HOSTCXX=g++ \
            CC="$TC/clang" LD="$TC/ld.lld" AR="$TC/llvm-ar" NM="$TC/llvm-nm" \
            OBJCOPY="$TC/llvm-objcopy" OBJDUMP="$TC/llvm-objdump" \
            READELF="$TC/llvm-readelf" STRIP="$TC/llvm-strip" \
            CROSS_COMPILE="$TC/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$TC/arm-linux-gnueabi-" \
            LLVM=1 LLVM_IAS=1 \
            -j$(nproc) Image

      - name: Compress Image with xz -9e
        run: |
          xz -9e -k -c out/arch/arm64/boot/Image > out/arch/arm64/boot/Image.xz

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image-${{ github.sha }}
          path: out/arch/arm64/boot/Image.xz
          if-no-files-found: error
